name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-posix:
    name: Ubuntu / POSIX Validation & Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up bash scripts permission
        run: chmod +x scripts/*.sh tests/*.sh install.sh bin/*.js

      - name: Verify leftover check script
        run: ./scripts/leftover_check.sh

      - name: Run Node.js safety CLI test suite
        run: node tests/test_safety_cli.js

      - name: Run Stop Gate Bash integration tests
        run: ./tests/test_stop_gate.sh

      - name: Run Mesh Lock Bash integration tests
        run: ./tests/test_mesh_lock.sh

      - name: Validate Markdown syntax & existence
        run: |
          test -f SKILL.md
          test -f README.md
          test -f AGENT_INSTALL.md
          test -f adapters/CLAUDE.md
          test -f adapters/.cursorrules
          test -f adapters/.windsurfrules
          test -f adapters/.clinerules
          test -f adapters/COPILOT.md
          echo "All core files and adapters verified successfully."

  validate-windows:
    name: Windows / PowerShell Test Suite
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Node.js safety CLI test suite
        run: node tests/test_safety_cli.js

      - name: Run Stop Gate PowerShell integration tests
        run: powershell -ExecutionPolicy Bypass -File ./tests/test_stop_gate.ps1

      - name: Run Mesh Lock PowerShell integration tests
        run: powershell -ExecutionPolicy Bypass -File ./tests/test_mesh_lock.ps1
