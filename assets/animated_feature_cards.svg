<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="100%" height="auto">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#040814" />
    </linearGradient>

    <filter id="fGlow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes radarSweep {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes laserScan {
      0% { transform: translateY(0px); opacity: 0.2; }
      50% { opacity: 1; }
      100% { transform: translateY(60px); opacity: 0.2; }
    }
    @keyframes rewindSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(-360deg); }
    }
    @keyframes chaosPulse {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.15); opacity: 1; filter: drop-shadow(0 0 8px #f43f5e); }
    }
    .radar-beam { transform-origin: 840px 80px; animation: radarSweep 3s linear infinite; }
    .scan-bar { animation: laserScan 2.5s ease-in-out infinite; }
    .rewind-arrow { transform-origin: 360px 80px; animation: rewindSpin 5s linear infinite; }
    .chaos-wave { transform-origin: 600px 80px; animation: chaosPulse 1.8s ease-in-out infinite; }
    .title { font-family: -apple-system, sans-serif; font-size: 16px; font-weight: 800; fill: #ffffff; }
    .body-txt { font-family: -apple-system, sans-serif; font-size: 12px; fill: #94a3b8; line-height: 1.5; }
    .badge { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; }
  </style>

  <!-- Card 1: Task Contract -->
  <g transform="translate(10, 10)">
    <rect x="0" y="0" width="220" height="240" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.5" />
    <!-- Icon Container -->
    <rect x="20" y="20" width="55" height="55" rx="10" fill="#0c4a6e" opacity="0.4" />
    <path d="M 47 32 L 62 38 L 62 55 Q 62 67 47 73 Q 32 67 32 55 L 32 38 Z" fill="none" stroke="#38bdf8" stroke-width="2" filter="url(#fGlow)" />
    <!-- Scanning Laser -->
    <line x1="28" y1="36" x2="66" y2="36" stroke="#00f2fe" stroke-width="2" class="scan-bar" filter="url(#fGlow)" />

    <text x="20" y="105" class="title">Task Contracts</text>
    <text x="20" y="125" class="badge" fill="#38bdf8">IMMUTABLE BOUNDS</text>
    <text x="20" y="152" class="body-txt">Restricts AI writes strictly to</text>
    <text x="20" y="170" class="body-txt">authorized files. Hard blocks</text>
    <text x="20" y="188" class="body-txt">unrelated churn &amp; lockfiles.</text>
    <rect x="20" y="206" width="180" height="22" rx="4" fill="#0f172a" />
    <text x="110" y="221" text-anchor="middle" class="badge" fill="#7dd3fc">0 Boundary Breaches</text>
  </g>

  <!-- Card 2: Atomic Checkpoint & Revert -->
  <g transform="translate(250, 10)">
    <rect x="0" y="0" width="220" height="240" rx="12" fill="url(#cardGrad)" stroke="#34d399" stroke-width="1.5" />
    <!-- Icon Container -->
    <rect x="20" y="20" width="55" height="55" rx="10" fill="#064e3b" opacity="0.4" />
    <!-- Rewind Circle -->
    <circle cx="47" cy="47" r="16" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="25 15" class="rewind-arrow" filter="url(#fGlow)" />
    <polygon points="47,31 43,37 51,37" fill="#34d399" />
    <circle cx="47" cy="47" r="4" fill="#ffffff" />

    <text x="20" y="105" class="title">Atomic Reverts</text>
    <text x="20" y="125" class="badge" fill="#34d399">ZERO PATCH-STACKING</text>
    <text x="20" y="152" class="body-txt">Snapshots state before edits.</text>
    <text x="20" y="170" class="body-txt">On failure, instantly rolls</text>
    <text x="20" y="188" class="body-txt">back to clean baseline.</text>
    <rect x="20" y="206" width="180" height="22" rx="4" fill="#0f172a" />
    <text x="110" y="221" text-anchor="middle" class="badge" fill="#6ee7b7">Circuit Breaker: 3 Strikes</text>
  </g>

  <!-- Card 3: Test Adversary -->
  <g transform="translate(490, 10)">
    <rect x="0" y="0" width="220" height="240" rx="12" fill="url(#cardGrad)" stroke="#f43f5e" stroke-width="1.5" />
    <!-- Icon Container -->
    <rect x="20" y="20" width="55" height="55" rx="10" fill="#4c0519" opacity="0.4" />
    <polygon points="50,26 38,46 48,46 44,66 58,42 48,42" fill="#fb7185" class="chaos-wave" filter="url(#fGlow)" />

    <text x="20" y="105" class="title">Test Adversary</text>
    <text x="20" y="125" class="badge" fill="#f43f5e">RED-TEAM INJECTIONS</text>
    <text x="20" y="152" class="body-txt">Stress-tests code against</text>
    <text x="20" y="170" class="body-txt">50 concurrent async workers,</text>
    <text x="20" y="188" class="body-txt">poison inputs, &amp; timeouts.</text>
    <rect x="20" y="206" width="180" height="22" rx="4" fill="#0f172a" />
    <text x="110" y="221" text-anchor="middle" class="badge" fill="#fda4af">50x Race Resisted</text>
  </g>

  <!-- Card 4: Secret Scanner -->
  <g transform="translate(730, 10)">
    <rect x="0" y="0" width="220" height="240" rx="12" fill="url(#cardGrad)" stroke="#a855f7" stroke-width="1.5" />
    <!-- Icon Container -->
    <rect x="20" y="20" width="55" height="55" rx="10" fill="#3b0764" opacity="0.4" />
    <circle cx="47" cy="47" r="18" fill="none" stroke="#a855f7" stroke-width="1.5" opacity="0.4" />
    <line x1="47" y1="47" x2="63" y2="47" stroke="#c084fc" stroke-width="2" class="radar-beam" filter="url(#fGlow)" />
    <circle cx="47" cy="47" r="3" fill="#ffffff" />

    <text x="20" y="105" class="title">Secret Scanner</text>
    <text x="20" y="125" class="badge" fill="#c084fc">CRYPTOGRAPHIC AUDIT</text>
    <text x="20" y="152" class="body-txt">Deep scans git diffs for</text>
    <text x="20" y="170" class="body-txt">OpenAI, Anthropic, AWS,</text>
    <text x="20" y="188" class="body-txt">GitHub, and private keys.</text>
    <rect x="20" y="206" width="180" height="22" rx="4" fill="#0f172a" />
    <text x="110" y="221" text-anchor="middle" class="badge" fill="#d8b4fe">0 Credential Leaks</text>
  </g>
</svg>
