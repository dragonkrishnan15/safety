<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="100%" height="auto">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="cardGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#040814" />
    </linearGradient>

    <linearGradient id="cardGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>

    <filter id="fGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    /* Mature Harmonic Animations */
    @keyframes radarSweep {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes laserScan {
      0% { transform: translateY(0px); opacity: 0.2; }
      50% { opacity: 0.9; }
      100% { transform: translateY(52px); opacity: 0.2; }
    }
    @keyframes meshRotate {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes chaosPulse {
      0%, 100% { transform: scale(1); opacity: 0.7; }
      50% { transform: scale(1.1); opacity: 1; filter: drop-shadow(0 0 8px rgba(244, 63, 94, 0.6)); }
    }

    .radar-beam { transform-origin: 47px 47px; animation: radarSweep 4s linear infinite; }
    .scan-bar { animation: laserScan 3s ease-in-out infinite; }
    .mesh-spin { transform-origin: 47px 47px; animation: meshRotate 10s linear infinite; }
    .chaos-wave { transform-origin: 47px 47px; animation: chaosPulse 2.4s ease-in-out infinite; }

    /* Default Theme (Dark) */
    .theme-card-bg { fill: url(#cardGradDark); stroke-width: 1.5; }
    .theme-title { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif; font-size: 16px; font-weight: 800; fill: #ffffff; }
    .theme-body { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif; font-size: 12px; fill: #94a3b8; line-height: 1.5; }
    .theme-pill-box { fill: #0f172a; }
    .theme-icon-box-cyan { fill: #0c4a6e; }
    .theme-icon-box-purple { fill: #4c1d95; }
    .theme-icon-box-rose { fill: #4c0519; }
    .theme-icon-box-green { fill: #064e3b; }

    /* Light Theme Adaptation */
    @media (prefers-color-scheme: light) {
      .theme-card-bg { fill: url(#cardGradLight); }
      .theme-title { fill: #0f172a; }
      .theme-body { fill: #475569; }
      .theme-pill-box { fill: #f1f5f9; }
      .theme-icon-box-cyan { fill: #e0f2fe; }
      .theme-icon-box-purple { fill: #f3e8ff; }
      .theme-icon-box-rose { fill: #ffe4e6; }
      .theme-icon-box-green { fill: #dcfce7; }
    }
  </style>

  <!-- Card 1: Task Contract -->
  <g transform="translate(10, 10)">
    <rect x="0" y="0" width="220" height="240" rx="14" class="theme-card-bg" stroke="#38bdf8" />
    <rect x="20" y="20" width="55" height="55" rx="10" class="theme-icon-box-cyan" opacity="0.5" />
    <path d="M 47 32 L 62 38 L 62 55 Q 62 67 47 73 Q 32 67 32 55 L 32 38 Z" fill="none" stroke="#38bdf8" stroke-width="2" filter="url(#fGlow)" />
    <line x1="28" y1="36" x2="66" y2="36" stroke="#00f2fe" stroke-width="2" class="scan-bar" filter="url(#fGlow)" />

    <text x="20" y="105" class="theme-title">Task Contracts</text>
    <text x="20" y="125" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#38bdf8">IMMUTABLE BOUNDS</text>
    <text x="20" y="152" class="theme-body">Restricts AI writes strictly to</text>
    <text x="20" y="170" class="theme-body">permitted file paths. Hard blocks</text>
    <text x="20" y="188" class="theme-body">unauthorized sprawl &amp; churn.</text>
    <rect x="20" y="206" width="180" height="22" rx="6" class="theme-pill-box" />
    <text x="110" y="221" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#7dd3fc">0 Boundary Breaches</text>
  </g>

  <!-- Card 2: Multi-Agent Mesh Lock -->
  <g transform="translate(250, 10)">
    <rect x="0" y="0" width="220" height="240" rx="14" class="theme-card-bg" stroke="#a855f7" />
    <rect x="20" y="20" width="55" height="55" rx="10" class="theme-icon-box-purple" opacity="0.5" />
    <!-- Rotating Mesh Orbit -->
    <g class="mesh-spin">
      <circle cx="47" cy="47" r="16" fill="none" stroke="#c084fc" stroke-width="1.8" stroke-dasharray="10 14" />
      <circle cx="47" cy="31" r="3.5" fill="#a855f7" />
      <circle cx="61" cy="55" r="3.5" fill="#38bdf8" />
      <circle cx="33" cy="55" r="3.5" fill="#34d399" />
    </g>
    <circle cx="47" cy="47" r="4" fill="#ffffff" filter="url(#fGlow)" />

    <text x="20" y="105" class="theme-title">Mesh Locking</text>
    <text x="20" y="125" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#c084fc">DECENTRALIZED LOCK</text>
    <text x="20" y="152" class="theme-body">Arbitrates path concurrency</text>
    <text x="20" y="170" class="theme-body">between Cursor, Claude &amp; Windsurf</text>
    <text x="20" y="188" class="theme-body">with atomic auto-expiry TTLs.</text>
    <rect x="20" y="206" width="180" height="22" rx="6" class="theme-pill-box" />
    <text x="110" y="221" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#d8b4fe">0 Race Collisions</text>
  </g>

  <!-- Card 3: Test Adversary -->
  <g transform="translate(490, 10)">
    <rect x="0" y="0" width="220" height="240" rx="14" class="theme-card-bg" stroke="#f43f5e" />
    <rect x="20" y="20" width="55" height="55" rx="10" class="theme-icon-box-rose" opacity="0.5" />
    <polygon points="50,26 38,46 48,46 44,66 58,42 48,42" fill="#fb7185" class="chaos-wave" filter="url(#fGlow)" />

    <text x="20" y="105" class="theme-title">Test Adversary</text>
    <text x="20" y="125" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#f43f5e">RED-TEAM CHAOS</text>
    <text x="20" y="152" class="theme-body">Stress-tests code against</text>
    <text x="20" y="170" class="theme-body">50 concurrent async workers,</text>
    <text x="20" y="188" class="theme-body">poison inputs, &amp; race spikes.</text>
    <rect x="20" y="206" width="180" height="22" rx="6" class="theme-pill-box" />
    <text x="110" y="221" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#fda4af">50x Race Resisted</text>
  </g>

  <!-- Card 4: Secret Scanner & Stop Gate -->
  <g transform="translate(730, 10)">
    <rect x="0" y="0" width="220" height="240" rx="14" class="theme-card-bg" stroke="#10b981" />
    <rect x="20" y="20" width="55" height="55" rx="10" class="theme-icon-box-green" opacity="0.5" />
    <!-- Rotating Radar Sweep -->
    <circle cx="47" cy="47" r="18" fill="none" stroke="#10b981" stroke-width="1.8" />
    <circle cx="47" cy="47" r="10" fill="none" stroke="#34d399" stroke-width="1" stroke-dasharray="4 4" />
    <g class="radar-beam">
      <line x1="47" y1="47" x2="47" y2="29" stroke="#34d399" stroke-width="2" filter="url(#fGlow)" />
    </g>
    <circle cx="47" cy="47" r="3" fill="#ffffff" />

    <text x="20" y="105" class="theme-title">Secret Scanner</text>
    <text x="20" y="125" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#10b981">ZERO-LEAK GATE</text>
    <text x="20" y="152" class="theme-body">Intercepts OpenAI, Anthropic,</text>
    <text x="20" y="170" class="theme-body">AWS &amp; GitHub keys prior to git</text>
    <text x="20" y="188" class="theme-body">commits with exit code 1.</text>
    <rect x="20" y="206" width="180" height="22" rx="6" class="theme-pill-box" />
    <text x="110" y="221" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#6ee7b7">100% Leak Prevention</text>
  </g>
</svg>
