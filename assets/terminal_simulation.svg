<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 440" width="100%" height="auto">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes typing {
      0% { opacity: 0; }
      15% { opacity: 1; }
      100% { opacity: 1; }
    }
    @keyframes line1 { 0%, 10% { opacity: 0; } 15%, 100% { opacity: 1; } }
    @keyframes line2 { 0%, 25% { opacity: 0; } 30%, 100% { opacity: 1; } }
    @keyframes line3 { 0%, 40% { opacity: 0; } 45%, 100% { opacity: 1; } }
    @keyframes line4 { 0%, 55% { opacity: 0; } 60%, 100% { opacity: 1; } }
    @keyframes line5 { 0%, 70% { opacity: 0; } 75%, 100% { opacity: 1; } }
    @keyframes line6 { 0%, 85% { opacity: 0; } 90%, 100% { opacity: 1; } }
    @keyframes cursorBlink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    .term-text { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; font-size: 13.5px; fill: #e2e8f0; }
    .muted { fill: #64748b; }
    .cyan { fill: #38bdf8; font-weight: bold; }
    .green { fill: #34d399; font-weight: bold; }
    .purple { fill: #c084fc; font-weight: bold; }
    .amber { fill: #fbbf24; font-weight: bold; }
    .cursor { animation: cursorBlink 0.8s infinite; fill: #38bdf8; }
    .l1 { animation: line1 8s infinite; }
    .l2 { animation: line2 8s infinite; }
    .l3 { animation: line3 8s infinite; }
    .l4 { animation: line4 8s infinite; }
    .l5 { animation: line5 8s infinite; }
    .l6 { animation: line6 8s infinite; }
  </style>

  <!-- Window Container -->
  <rect x="5" y="5" width="840" height="430" rx="14" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Window Titlebar -->
  <path d="M 5 19 C 5 11 11 5 19 5 L 831 5 C 839 5 845 11 845 19 L 845 42 L 5 42 Z" fill="#131c2e" />
  <line x1="5" y1="42" x2="845" y2="42" stroke="#1e293b" stroke-width="1" />

  <!-- Window Buttons -->
  <circle cx="28" cy="24" r="6" fill="#ef4444" />
  <circle cx="48" cy="24" r="6" fill="#f59e0b" />
  <circle cx="68" cy="24" r="6" fill="#10b981" />

  <!-- Title Text -->
  <text x="425" y="28" text-anchor="middle" class="term-text muted" font-size="12">master-skill / safety - Zero-Trust Stop Gate Terminal</text>

  <!-- Terminal Content -->
  <g transform="translate(30, 80)">
    <!-- Command Prompt -->
    <text x="0" y="0" class="term-text">
      <tspan class="purple">developer@safety-node</tspan><tspan class="muted">:</tspan><tspan class="cyan">~/project</tspan><tspan class="muted">$</tspan> safety gate --test "npm test"
      <rect x="520" y="-12" width="8" height="15" class="cursor" />
    </text>

    <!-- Line 1: Header -->
    <g class="l1">
      <text x="0" y="32" class="term-text cyan" filter="url(#glow)">[SAFETY KERNEL] Initializing Zero-Trust Invariant Audit...</text>
    </g>

    <!-- Line 2: Contract Bounds -->
    <g class="l2">
      <rect x="0" y="54" width="70" height="20" rx="4" fill="#065f46" />
      <text x="35" y="68" text-anchor="middle" class="term-text green" font-size="11">PASSED</text>
      <text x="85" y="68" class="term-text">Contract Bounds &amp; Permissions: <tspan class="cyan">3 paths authorized</tspan> (0 forbidden modifications)</text>
    </g>

    <!-- Line 3: Secret Scanning -->
    <g class="l3">
      <rect x="0" y="88" width="70" height="20" rx="4" fill="#065f46" />
      <text x="35" y="102" text-anchor="middle" class="term-text green" font-size="11">PASSED</text>
      <text x="85" y="102" class="term-text">Cryptographic Secret Scanner: <tspan class="green">0 API keys, tokens, or private keys detected</tspan></text>
    </g>

    <!-- Line 4: Clean Diff Leftovers -->
    <g class="l4">
      <rect x="0" y="122" width="70" height="20" rx="4" fill="#065f46" />
      <text x="35" y="136" text-anchor="middle" class="term-text green" font-size="11">PASSED</text>
      <text x="85" y="136" class="term-text">Sanitary Code Diff: <tspan class="green">0 temporary DEBUG-CT logs or trailing whitespace</tspan></text>
    </g>

    <!-- Line 5: Test Adversary -->
    <g class="l5">
      <rect x="0" y="156" width="70" height="20" rx="4" fill="#065f46" />
      <text x="35" y="170" text-anchor="middle" class="term-text green" font-size="11">PASSED</text>
      <text x="85" y="170" class="term-text">Test Adversary Resilience: <tspan class="purple">30/30 chaos injections resisted</tspan> (concurrency &amp; poison)</text>
    </g>

    <!-- Line 6: Final Verdict Badge -->
    <g class="l6">
      <rect x="0" y="200" width="790" height="90" rx="8" fill="#131f37" stroke="#10b981" stroke-width="1.5" filter="url(#glow)" />
      <text x="25" y="235" class="term-text green" font-size="16">VERDICT: ZERO-TRUST SAFETY GATE PASSED (READY TO MERGE)</text>
      <text x="25" y="265" class="term-text muted">Evidence Chain: <tspan class="cyan">ct-ledger.jsonl (4 signed proofs)</tspan> | Diff Ratio: <tspan class="amber">1.01 (Optimal)</tspan> | Exit Code: <tspan class="green">0</tspan></text>
    </g>
  </g>
</svg>
