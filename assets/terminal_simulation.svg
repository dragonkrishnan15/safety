<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="100%" height="auto">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="termBgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c16" />
      <stop offset="60%" stop-color="#0d1424" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="termBgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>

    <linearGradient id="termBorderDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.7"/>
    </linearGradient>

    <linearGradient id="termBorderLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.5"/>
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="badgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    /* Mature Pacing & Progressive Line Animation (14s Loop) */
    @keyframes line1 { 0%, 10% { opacity: 0; transform: translateY(4px); } 14%, 96% { opacity: 1; transform: translateY(0); } 99%, 100% { opacity: 0; } }
    @keyframes line2 { 0%, 24% { opacity: 0; transform: translateY(4px); } 28%, 96% { opacity: 1; transform: translateY(0); } 99%, 100% { opacity: 0; } }
    @keyframes line3 { 0%, 40% { opacity: 0; transform: translateY(4px); } 44%, 96% { opacity: 1; transform: translateY(0); } 99%, 100% { opacity: 0; } }
    @keyframes line4 { 0%, 56% { opacity: 0; transform: translateY(4px); } 60%, 96% { opacity: 1; transform: translateY(0); } 99%, 100% { opacity: 0; } }
    @keyframes line5 { 0%, 72% { opacity: 0; transform: translateY(4px); } 76%, 96% { opacity: 1; transform: translateY(0); } 99%, 100% { opacity: 0; } }
    @keyframes line6 { 0%, 86% { opacity: 0; transform: translateY(6px); } 89%, 96% { opacity: 1; transform: translateY(0); } 99%, 100% { opacity: 0; } }

    @keyframes cursorBlink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    .cursor { animation: cursorBlink 0.85s infinite; fill: #38bdf8; }
    .term-font { font-family: 'JetBrains Mono', 'SF Mono', 'Fira Code', 'Cascadia Code', monospace; }

    .l1 { animation: line1 14s cubic-bezier(0.16, 1, 0.3, 1) infinite; }
    .l2 { animation: line2 14s cubic-bezier(0.16, 1, 0.3, 1) infinite; }
    .l3 { animation: line3 14s cubic-bezier(0.16, 1, 0.3, 1) infinite; }
    .l4 { animation: line4 14s cubic-bezier(0.16, 1, 0.3, 1) infinite; }
    .l5 { animation: line5 14s cubic-bezier(0.16, 1, 0.3, 1) infinite; }
    .l6 { animation: line6 14s cubic-bezier(0.16, 1, 0.3, 1) infinite; }

    /* Default Theme (Dark Obsidian) */
    .theme-win-bg { fill: url(#termBgDark); stroke: url(#termBorderDark); }
    .theme-win-header { fill: #0f172a; stroke: #1e293b; }
    .theme-win-title { fill: #64748b; }
    .theme-body-text { fill: #e2e8f0; }
    .theme-muted-text { fill: #64748b; }
    .theme-pass-bg { fill: #064e3b; stroke: #059669; }
    .theme-verdict-bg { fill: #091c2e; stroke: #10b981; }

    /* Light Theme Adaptation */
    @media (prefers-color-scheme: light) {
      .theme-win-bg { fill: url(#termBgLight); stroke: url(#termBorderLight); }
      .theme-win-header { fill: #f1f5f9; stroke: #e2e8f0; }
      .theme-win-title { fill: #475569; }
      .theme-body-text { fill: #0f172a; }
      .theme-muted-text { fill: #64748b; }
      .theme-pass-bg { fill: #dcfce7; stroke: #16a34a; }
      .theme-verdict-bg { fill: #f0fdf4; stroke: #059669; }
    }
  </style>

  <!-- Terminal Window Container -->
  <rect x="4" y="4" width="872" height="452" rx="16" class="theme-win-bg" stroke-width="1.6" />

  <!-- Window Header Bar -->
  <path d="M 4 20 C 4 11 11 4 20 4 L 860 4 C 869 4 876 11 876 20 L 876 46 L 4 46 Z" class="theme-win-header" stroke-width="1" />

  <!-- Window Control Buttons (Frosted Mac Style) -->
  <circle cx="28" cy="25" r="6" fill="#ef4444" />
  <circle cx="48" cy="25" r="6" fill="#f59e0b" />
  <circle cx="68" cy="25" r="6" fill="#10b981" />

  <!-- Window Title Center -->
  <text x="440" y="29" text-anchor="middle" class="term-font theme-win-title" font-size="12" font-weight="600" letter-spacing="1">
    master-skill / safety - Zero-Trust Stop Gate Terminal
  </text>

  <!-- Live Mode Chip Right -->
  <g transform="translate(740, 15)">
    <rect x="0" y="0" width="116" height="20" rx="10" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <circle cx="10" cy="10" r="3.5" fill="#34d399"/>
    <text x="20" y="14" class="term-font" font-size="10" font-weight="700" fill="#a7f3d0">v5.2 ACTIVE</text>
  </g>

  <!-- Terminal Output Canvas -->
  <g transform="translate(32, 85)">
    <!-- Command Prompt Line -->
    <text x="0" y="0" class="term-font" font-size="14">
      <tspan fill="#a855f7" font-weight="700">principal-ai</tspan><tspan fill="#64748b">@</tspan><tspan fill="#38bdf8" font-weight="700">safety-mesh</tspan><tspan fill="#64748b">:~/workspace$</tspan> <tspan class="theme-body-text" font-weight="600">safety gate --test "npm test"</tspan>
      <rect x="520" y="-12" width="8.5" height="16" class="cursor" />
    </text>

    <!-- Line 1: Kernel Initialization -->
    <g class="l1">
      <text x="0" y="34" class="term-font" font-size="13" font-weight="700" fill="#38bdf8" filter="url(#softGlow)">
        [SAFETY KERNEL] Initializing Zero-Trust Invariant Pre-Commit Audit...
      </text>
    </g>

    <!-- Line 2: Contract Bounds Check -->
    <g class="l2">
      <rect x="0" y="58" width="76" height="22" rx="4" class="theme-pass-bg" stroke-width="1" />
      <text x="38" y="73" text-anchor="middle" class="term-font" font-size="11" font-weight="800" fill="#10b981">PASSED</text>
      <text x="90" y="74" class="term-font theme-body-text" font-size="13">
        Contract Invariant Bounds: <tspan fill="#38bdf8" font-weight="700">3 paths permitted</tspan> (0 forbidden modifications)
      </text>
    </g>

    <!-- Line 3: Cryptographic Secret Scanning -->
    <g class="l3">
      <rect x="0" y="94" width="76" height="22" rx="4" class="theme-pass-bg" stroke-width="1" />
      <text x="38" y="109" text-anchor="middle" class="term-font" font-size="11" font-weight="800" fill="#10b981">PASSED</text>
      <text x="90" y="110" class="term-font theme-body-text" font-size="13">
        Zero-Leak Secret Scanner: <tspan fill="#34d399" font-weight="700">0 API keys, PATs, or tokens detected</tspan> (12 rules active)
      </text>
    </g>

    <!-- Line 4: Diff Cleanliness & Code Hygiene -->
    <g class="l4">
      <rect x="0" y="130" width="76" height="22" rx="4" class="theme-pass-bg" stroke-width="1" />
      <text x="38" y="145" text-anchor="middle" class="term-font" font-size="11" font-weight="800" fill="#10b981">PASSED</text>
      <text x="90" y="146" class="term-font theme-body-text" font-size="13">
        Sanitary Code Hygiene: <tspan fill="#34d399" font-weight="700">0 DEBUG-CT leftovers</tspan> | 0 swallowed catch blocks
      </text>
    </g>

    <!-- Line 5: Test Adversary Chaos Injection -->
    <g class="l5">
      <rect x="0" y="166" width="76" height="22" rx="4" class="theme-pass-bg" stroke-width="1" />
      <text x="38" y="181" text-anchor="middle" class="term-font" font-size="11" font-weight="800" fill="#10b981">PASSED</text>
      <text x="90" y="182" class="term-font theme-body-text" font-size="13">
        Test Adversary Resilience: <tspan fill="#a855f7" font-weight="700">30/30 chaos injections passed</tspan> (concurrency &amp; poison)
      </text>
    </g>

    <!-- Line 6: Merged Verified Verdict Banner -->
    <g class="l6">
      <rect x="0" y="212" width="816" height="96" rx="10" class="theme-verdict-bg" stroke-width="1.8" filter="url(#badgeGlow)" />
      <!-- Left decorative green accent bar -->
      <path d="M 0 222 C 0 216 4 212 10 212 L 14 212 L 14 308 L 10 308 C 4 308 0 304 0 298 Z" fill="#10b981" />

      <text x="28" y="248" class="term-font" font-size="16" font-weight="800" fill="#10b981" letter-spacing="0.5">
        VERDICT: ZERO-TRUST SAFETY GATE PASSED (READY TO MERGE)
      </text>
      <text x="28" y="280" class="term-font theme-muted-text" font-size="12.5">
        Evidence Chain: <tspan fill="#38bdf8" font-weight="700">ct-ledger.jsonl (4 signed proofs [EV-5201..5204])</tspan> | Diff Ratio: <tspan fill="#f59e0b" font-weight="700">1.01 (Optimal)</tspan> | Exit Code: <tspan fill="#10b981" font-weight="700">0</tspan>
      </text>
    </g>
  </g>
</svg>
