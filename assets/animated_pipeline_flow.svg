<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 230" width="100%" height="auto">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="pipeBgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b16" />
      <stop offset="50%" stop-color="#0b1222" />
      <stop offset="100%" stop-color="#04070f" />
    </linearGradient>

    <linearGradient id="pipeBgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>

    <linearGradient id="laserBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <filter id="pGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    /* Mature Harmonic Animation Cycle */
    @keyframes packetFlow {
      0% { stroke-dashoffset: 240; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes nodePulse {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 4px rgba(56, 189, 248, 0.2)); }
      50% { transform: scale(1.025); filter: drop-shadow(0 0 12px rgba(56, 189, 248, 0.6)); }
    }

    .flow-line { stroke-width: 3; }
    .flow-packet {
      stroke: url(#laserBeam);
      stroke-width: 3.5;
      stroke-dasharray: 25 95;
      animation: packetFlow 3s linear infinite;
    }

    .node-1 { animation: nodePulse 3.6s ease-in-out infinite 0.0s; transform-origin: 88px 115px; }
    .node-2 { animation: nodePulse 3.6s ease-in-out infinite 0.6s; transform-origin: 244px 115px; }
    .node-3 { animation: nodePulse 3.6s ease-in-out infinite 1.2s; transform-origin: 400px 115px; }
    .node-4 { animation: nodePulse 3.6s ease-in-out infinite 1.8s; transform-origin: 556px 115px; }
    .node-5 { animation: nodePulse 3.6s ease-in-out infinite 2.4s; transform-origin: 712px 115px; }
    .node-6 { animation: nodePulse 3.6s ease-in-out infinite 3.0s; transform-origin: 868px 115px; }

    /* Theme Styles */
    .theme-pipe-bg { fill: url(#pipeBgDark); stroke: #1e293b; }
    .theme-node-bg { fill: #0d1527; }
    .theme-title { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif; font-size: 13px; font-weight: 700; fill: #f8fafc; }
    .theme-desc { font-family: 'JetBrains Mono', 'SF Mono', monospace; font-size: 10px; fill: #94a3b8; }
    .theme-bus-line { stroke: #1e293b; }

    @media (prefers-color-scheme: light) {
      .theme-pipe-bg { fill: url(#pipeBgLight); stroke: #cbd5e1; }
      .theme-node-bg { fill: #ffffff; }
      .theme-title { fill: #0f172a; }
      .theme-desc { fill: #64748b; }
      .theme-bus-line { stroke: #cbd5e1; }
    }
  </style>

  <!-- Container Box -->
  <rect x="4" y="4" width="952" height="222" rx="16" class="theme-pipe-bg" stroke-width="1.5" />

  <!-- Connecting Bus Lines -->
  <line x1="88" y1="115" x2="868" y2="115" class="theme-bus-line flow-line" />
  <!-- Moving Energy Packets -->
  <line x1="88" y1="115" x2="868" y2="115" class="flow-packet" filter="url(#pGlow)" />

  <!-- Stage 1: Triage Gate -->
  <g class="node-1">
    <rect x="20" y="50" width="136" height="130" rx="12" class="theme-node-bg" stroke="#38bdf8" stroke-width="1.6" />
    <circle cx="88" cy="82" r="16" fill="#0284c7" opacity="0.25" />
    <text x="88" y="88" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="800" fill="#38bdf8">01</text>
    <text x="88" y="124" text-anchor="middle" class="theme-title">Triage Gate</text>
    <text x="88" y="144" text-anchor="middle" class="theme-desc">Fact Baseline</text>
    <text x="88" y="158" text-anchor="middle" class="theme-desc">Read/Write Bounds</text>
  </g>

  <!-- Stage 2: Task Contract -->
  <g class="node-2">
    <rect x="176" y="50" width="136" height="130" rx="12" class="theme-node-bg" stroke="#818cf8" stroke-width="1.6" />
    <circle cx="244" cy="82" r="16" fill="#4338ca" opacity="0.25" />
    <text x="244" y="88" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="800" fill="#818cf8">02</text>
    <text x="244" y="124" text-anchor="middle" class="theme-title">Task Contract</text>
    <text x="244" y="144" text-anchor="middle" class="theme-desc">Permitted Paths</text>
    <text x="244" y="158" text-anchor="middle" class="theme-desc">Forbidden Walls</text>
  </g>

  <!-- Stage 3: Multi-Agent Mesh Lock -->
  <g class="node-3">
    <rect x="332" y="50" width="136" height="130" rx="12" class="theme-node-bg" stroke="#c084fc" stroke-width="1.6" />
    <circle cx="400" cy="82" r="16" fill="#7e22ce" opacity="0.25" />
    <text x="400" y="88" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="800" fill="#c084fc">03</text>
    <text x="400" y="124" text-anchor="middle" class="theme-title">Mesh Lock</text>
    <text x="400" y="144" text-anchor="middle" class="theme-desc">Atomic Collision</text>
    <text x="400" y="158" text-anchor="middle" class="theme-desc">Agent Arbitrator</text>
  </g>

  <!-- Stage 4: Atomic Checkpoint -->
  <g class="node-4">
    <rect x="488" y="50" width="136" height="130" rx="12" class="theme-node-bg" stroke="#34d399" stroke-width="1.6" />
    <circle cx="556" cy="82" r="16" fill="#059669" opacity="0.25" />
    <text x="556" y="88" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="800" fill="#34d399">04</text>
    <text x="556" y="124" text-anchor="middle" class="theme-title">Atomic Check</text>
    <text x="556" y="144" text-anchor="middle" class="theme-desc">Snapshot Clean</text>
    <text x="556" y="158" text-anchor="middle" class="theme-desc">Instant Revert</text>
  </g>

  <!-- Stage 5: Test Adversary -->
  <g class="node-5">
    <rect x="644" y="50" width="136" height="130" rx="12" class="theme-node-bg" stroke="#f43f5e" stroke-width="1.6" />
    <circle cx="712" cy="82" r="16" fill="#e11d48" opacity="0.25" />
    <text x="712" y="88" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="800" fill="#f43f5e">05</text>
    <text x="712" y="124" text-anchor="middle" class="theme-title">Test Adversary</text>
    <text x="712" y="144" text-anchor="middle" class="theme-desc">Chaos Injection</text>
    <text x="712" y="158" text-anchor="middle" class="theme-desc">50x Race Resisted</text>
  </g>

  <!-- Stage 6: Stop Gate & Ledger -->
  <g class="node-6">
    <rect x="800" y="50" width="136" height="130" rx="12" class="theme-node-bg" stroke="#10b981" stroke-width="1.6" />
    <circle cx="868" cy="82" r="16" fill="#047857" opacity="0.25" />
    <text x="868" y="88" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="800" fill="#10b981">06</text>
    <text x="868" y="124" text-anchor="middle" class="theme-title">Stop Gate</text>
    <text x="868" y="144" text-anchor="middle" class="theme-desc">Zero Secret Leaks</text>
    <text x="868" y="158" text-anchor="middle" class="theme-desc">Signed Ledger</text>
  </g>
</svg>
