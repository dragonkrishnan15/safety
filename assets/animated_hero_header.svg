<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 290" width="100%" height="auto">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="headerBgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#0a1226" />
      <stop offset="100%" stop-color="#030509" />
    </linearGradient>

    <linearGradient id="headerBgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>

    <!-- Animated Luminescent Title Gradient -->
    <linearGradient id="textAnimGrad" x1="0%" y1="0%" x2="200%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="25%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="75%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#38bdf8" />
      <animate attributeName="x1" from="0%" to="-100%" dur="8s" repeatCount="indefinite" />
      <animate attributeName="x2" from="200%" to="100%" dur="8s" repeatCount="indefinite" />
    </linearGradient>

    <!-- Glowing Cyber Border Laser -->
    <linearGradient id="borderLaser" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.15"/>
      <animate attributeName="x1" from="-100%" to="100%" dur="6s" repeatCount="indefinite" />
      <animate attributeName="x2" from="0%" to="200%" dur="6s" repeatCount="indefinite" />
    </linearGradient>

    <!-- Refined Glow Filters -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    /* Mature Harmonic Animations */
    @keyframes pulseRing {
      0%, 100% { transform: scale(0.97); opacity: 0.7; }
      50% { transform: scale(1.03); opacity: 1; filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.6)); }
    }
    @keyframes spinOrbit {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes counterSpin {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }
    @keyframes beaconBlink {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; filter: drop-shadow(0 0 6px #10b981); }
    }
    @keyframes scanLineSweep {
      0% { transform: translateY(-30px); opacity: 0; }
      20% { opacity: 0.6; }
      80% { opacity: 0.6; }
      100% { transform: translateY(290px); opacity: 0; }
    }

    .orbit-1 { transform-origin: 125px 145px; animation: spinOrbit 18s linear infinite; }
    .orbit-2 { transform-origin: 125px 145px; animation: counterSpin 14s linear infinite; }
    .shield-pulse { transform-origin: 125px 145px; animation: pulseRing 4.5s ease-in-out infinite; }
    .status-beacon { animation: beaconBlink 2.2s ease-in-out infinite; }
    .scan-laser { animation: scanLineSweep 6s ease-in-out infinite; }

    /* Default (Dark Mode) Styles */
    .theme-base { fill: url(#headerBgDark); stroke: #1e293b; }
    .theme-grid-line { stroke: #1e293b; opacity: 0.4; }
    .theme-sub { fill: #94a3b8; }
    .theme-chip-bg { fill: #0f172a; stroke: #334155; }
    .theme-chip-text { fill: #e2e8f0; }
    .theme-shield-outer { fill: #0c1836; stroke: #38bdf8; }
    .theme-shield-inner { fill: #0f244c; stroke: #10b981; }

    /* System Theme Adaptation: Light Mode */
    @media (prefers-color-scheme: light) {
      .theme-base { fill: url(#headerBgLight); stroke: #cbd5e1; }
      .theme-grid-line { stroke: #e2e8f0; opacity: 0.9; }
      .theme-sub { fill: #475569; }
      .theme-chip-bg { fill: #ffffff; stroke: #cbd5e1; }
      .theme-chip-text { fill: #1e293b; }
      .theme-shield-outer { fill: #e0f2fe; stroke: #0284c7; }
      .theme-shield-inner { fill: #f0fdf4; stroke: #059669; }
    }
  </style>

  <!-- Base Canvas Card -->
  <rect x="2" y="2" width="996" height="286" rx="16" class="theme-base" stroke-width="1.5" />

  <!-- Animated Border Glow Line -->
  <rect x="4" y="4" width="992" height="282" rx="14" fill="none" stroke="url(#borderLaser)" stroke-width="1.8" />

  <!-- Background Precision Matrix Grid -->
  <g stroke-width="0.75" class="theme-grid-line">
    <line x1="20" y1="58" x2="980" y2="58" />
    <line x1="20" y1="116" x2="980" y2="116" />
    <line x1="20" y1="174" x2="980" y2="174" />
    <line x1="20" y1="232" x2="980" y2="232" />
    <line x1="260" y1="20" x2="260" y2="270" />
    <line x1="500" y1="20" x2="500" y2="270" />
    <line x1="740" y1="20" x2="740" y2="270" />
  </g>

  <!-- Ambient Scanning Beam -->
  <line x1="30" y1="0" x2="970" y2="0" stroke="#38bdf8" stroke-width="1.5" opacity="0.35" class="scan-laser" filter="url(#softGlow)" />

  <!-- Left: Animated Holographic Shield Core -->
  <g transform="translate(10, 0)">
    <!-- Outer Precision Orbit Ring 1 -->
    <ellipse cx="125" cy="145" rx="78" ry="78" fill="none" stroke="#38bdf8" stroke-width="1.4" stroke-dasharray="14 20" class="orbit-1" opacity="0.7" filter="url(#softGlow)" />
    <!-- Outer Precision Orbit Ring 2 -->
    <ellipse cx="125" cy="145" rx="90" ry="44" fill="none" stroke="#a855f7" stroke-width="1.2" stroke-dasharray="8 16" class="orbit-2" opacity="0.6" />
    
    <!-- Shield Container -->
    <g class="shield-pulse">
      <path d="M 125 80 L 172 99 L 172 153 Q 172 193 125 214 Q 78 193 78 153 L 78 99 Z" class="theme-shield-outer" stroke-width="2.5" filter="url(#neonGlow)" />
      
      <!-- Inner Shield Core -->
      <path d="M 125 91 L 159 106 L 159 149 Q 159 180 125 199 Q 91 180 91 149 L 91 106 Z" class="theme-shield-inner" stroke-width="1.4" opacity="0.9" />
      
      <!-- Neural Logic Node Graphic -->
      <circle cx="125" cy="128" r="6" fill="#38bdf8" filter="url(#softGlow)" />
      <circle cx="108" cy="156" r="4" fill="#34d399" />
      <circle cx="142" cy="156" r="4" fill="#a855f7" />
      <line x1="125" y1="128" x2="108" y2="156" stroke="#38bdf8" stroke-width="1.6" />
      <line x1="125" y1="128" x2="142" y2="156" stroke="#38bdf8" stroke-width="1.6" />
      <line x1="108" y1="156" x2="142" y2="156" stroke="#34d399" stroke-width="1.4" stroke-dasharray="3 3" />
      <circle cx="125" cy="144" r="2.5" fill="#ffffff" filter="url(#softGlow)" />
    </g>
  </g>

  <!-- Right: Professional Typography & Status Systems -->
  <g transform="translate(260, 0)">
    <!-- Top Status Row -->
    <g transform="translate(0, 48)">
      <!-- Live Status Chip -->
      <rect x="0" y="0" width="180" height="26" rx="13" fill="#064e3b" stroke="#10b981" stroke-width="1" />
      <circle cx="14" cy="13" r="5" fill="#34d399" class="status-beacon" />
      <text x="28" y="17" font-family="'JetBrains Mono', 'SF Mono', monospace" font-size="11" font-weight="700" fill="#a7f3d0" letter-spacing="1.5">ZERO-TRUST ACTIVE</text>

      <!-- Architecture Version Badge -->
      <rect x="192" y="0" width="138" height="26" rx="13" fill="#1e1b4b" stroke="#818cf8" stroke-width="1" />
      <text x="261" y="17" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', monospace" font-size="11" font-weight="700" fill="#c7d2fe">v5.2 APEX MESH</text>

      <!-- Protocol Security Badge -->
      <rect x="342" y="0" width="136" height="26" rx="13" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
      <text x="410" y="17" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', monospace" font-size="11" font-weight="700" fill="#7dd3fc">HARDENED GATE</text>
    </g>

    <!-- Primary Title with Flowing Metallic Laser Gradient -->
    <text x="0" y="128" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="url(#textAnimGrad)" letter-spacing="3" filter="url(#softGlow)">
      SAFETY / MASTER-SKILL
    </text>

    <!-- Subtitle: High Precision Font Hierarchy -->
    <text x="0" y="165" class="theme-sub" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" letter-spacing="0.5">
      Autonomous AI Agent Governance, Mesh Locking &amp; Cognitive Reasoning
    </text>

    <!-- Interactive Feature Pill Row -->
    <g transform="translate(0, 196)">
      <!-- Pill 1: Contracts -->
      <rect x="0" y="0" width="160" height="30" rx="8" class="theme-chip-bg" stroke-width="1" />
      <circle cx="16" cy="15" r="4" fill="#38bdf8" />
      <text x="28" y="20" class="theme-chip-text" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">Task Contracts</text>

      <!-- Pill 2: Mesh Lock -->
      <rect x="172" y="0" width="168" height="30" rx="8" class="theme-chip-bg" stroke-width="1" />
      <circle cx="188" cy="15" r="4" fill="#a855f7" />
      <text x="200" y="20" class="theme-chip-text" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">Multi-Agent Mesh</text>

      <!-- Pill 3: Chaos Adversary -->
      <rect x="352" y="0" width="168" height="30" rx="8" class="theme-chip-bg" stroke-width="1" />
      <circle cx="368" cy="15" r="4" fill="#f43f5e" />
      <text x="380" y="20" class="theme-chip-text" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">Chaos Adversary</text>

      <!-- Pill 4: Zero Secret Leaks -->
      <rect x="532" y="0" width="165" height="30" rx="8" class="theme-chip-bg" stroke-width="1" />
      <circle cx="548" cy="15" r="4" fill="#34d399" />
      <text x="560" y="20" class="theme-chip-text" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">Zero Secret Leaks</text>
    </g>
  </g>
</svg>
