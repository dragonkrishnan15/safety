<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="100%" height="auto">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="headerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#0a1128" />
      <stop offset="100%" stop-color="#020409" />
    </linearGradient>

    <!-- Animated Text Gradient -->
    <linearGradient id="textAnimGrad" x1="0%" y1="0%" x2="200%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="25%" stop-color="#4facfe" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="75%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#00f2fe" />
      <animate attributeName="x1" from="0%" to="-100%" dur="6s" repeatCount="indefinite" />
      <animate attributeName="x2" from="200%" to="100%" dur="6s" repeatCount="indefinite" />
    </linearGradient>

    <!-- Glowing Cyber Border -->
    <linearGradient id="borderLaser" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="1"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.2"/>
      <animate attributeName="x1" from="-100%" to="100%" dur="4s" repeatCount="indefinite" />
      <animate attributeName="x2" from="0%" to="200%" dur="4s" repeatCount="indefinite" />
    </linearGradient>

    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseRing {
      0% { transform: scale(0.95); opacity: 0.4; }
      50% { transform: scale(1.05); opacity: 0.9; }
      100% { transform: scale(0.95); opacity: 0.4; }
    }
    @keyframes spinOrbit {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes counterSpin {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }
    @keyframes beaconBlink {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; filter: drop-shadow(0 0 8px #10b981); }
    }
    @keyframes scanLineSweep {
      0% { transform: translateY(-50px); opacity: 0; }
      50% { opacity: 0.8; }
      100% { transform: translateY(280px); opacity: 0; }
    }
    .orbit-1 { transform-origin: 120px 140px; animation: spinOrbit 12s linear infinite; }
    .orbit-2 { transform-origin: 120px 140px; animation: counterSpin 8s linear infinite; }
    .shield-pulse { transform-origin: 120px 140px; animation: pulseRing 3.5s ease-in-out infinite; }
    .status-beacon { animation: beaconBlink 1.8s ease-in-out infinite; }
    .scan-laser { animation: scanLineSweep 5s ease-in-out infinite; }
    .title-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 500; fill: #94a3b8; letter-spacing: 2px; }
  </style>

  <!-- Base Plate -->
  <rect x="0" y="0" width="1000" height="280" rx="16" fill="url(#headerBg)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Animated Border Glow Line -->
  <rect x="2" y="2" width="996" height="276" rx="15" fill="none" stroke="url(#borderLaser)" stroke-width="2" />

  <!-- Background Grid Matrix Lines -->
  <g stroke="#1e293b" stroke-width="0.7" opacity="0.35">
    <line x1="20" y1="50" x2="980" y2="50" />
    <line x1="20" y1="100" x2="980" y2="100" />
    <line x1="20" y1="150" x2="980" y2="150" />
    <line x1="20" y1="200" x2="980" y2="200" />
    <line x1="20" y1="250" x2="980" y2="250" />
    <line x1="260" y1="20" x2="260" y2="260" />
    <line x1="500" y1="20" x2="500" y2="260" />
    <line x1="740" y1="20" x2="740" y2="260" />
  </g>

  <!-- Laser Scanning Bar -->
  <line x1="30" y1="0" x2="970" y2="0" stroke="#00f2fe" stroke-width="1.5" opacity="0.4" class="scan-laser" filter="url(#softGlow)" />

  <!-- Left: Animated Hologram Shield & Brain Core -->
  <g transform="translate(10, 0)">
    <!-- Outer Orbit Ring 1 -->
    <ellipse cx="120" cy="140" rx="72" ry="72" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="12 18" class="orbit-1" opacity="0.7" filter="url(#softGlow)" />
    <!-- Outer Orbit Ring 2 -->
    <ellipse cx="120" cy="140" rx="84" ry="40" fill="none" stroke="#a855f7" stroke-width="1.2" stroke-dasharray="8 14" class="orbit-2" opacity="0.6" />
    
    <!-- Shield Container -->
    <g class="shield-pulse">
      <path d="M 120 78 L 164 96 L 164 148 Q 164 186 120 206 Q 76 186 76 148 L 76 96 Z" fill="#0c1731" stroke="#00f2fe" stroke-width="2.5" filter="url(#neonGlow)" />
      
      <!-- Inner Shield Glow Circuit -->
      <path d="M 120 88 L 152 102 L 152 144 Q 152 174 120 192 Q 88 174 88 144 L 88 102 Z" fill="#132448" stroke="#10b981" stroke-width="1.2" opacity="0.8" />
      
      <!-- Core Cyber Icon -->
      <path d="M 108 126 C 104 120, 106 112, 114 112 C 117 106, 126 106, 129 112 C 137 112, 139 120, 135 126 C 140 131, 138 140, 132 144 C 132 152, 126 156, 120 156 C 114 156, 108 152, 108 144 C 102 140, 100 131, 105 126 Z" fill="none" stroke="#38bdf8" stroke-width="2" filter="url(#neonGlow)" />
      <line x1="120" y1="112" x2="120" y2="156" stroke="#10b981" stroke-width="1.5" />
      <circle cx="120" cy="134" r="3" fill="#ffffff" filter="url(#softGlow)" />
    </g>
  </g>

  <!-- Right: Typography & Status Badges -->
  <g transform="translate(250, 0)">
    <!-- Live Status Chip -->
    <g transform="translate(0, 48)">
      <rect x="0" y="0" width="190" height="26" rx="13" fill="#064e3b" stroke="#10b981" stroke-width="1" />
      <circle cx="14" cy="13" r="5" fill="#34d399" class="status-beacon" />
      <text x="28" y="17" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#a7f3d0" letter-spacing="1.5">ZERO-TRUST ACTIVE</text>
    </g>

    <!-- Version Badge -->
    <g transform="translate(202, 48)">
      <rect x="0" y="0" width="140" height="26" rx="13" fill="#1e1b4b" stroke="#818cf8" stroke-width="1" />
      <text x="70" y="17" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#c7d2fe">v5.2 APEX MESH</text>
    </g>

    <!-- Main Title with Continuous Gradient Animation -->
    <text x="0" y="126" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="url(#textAnimGrad)" letter-spacing="3" filter="url(#softGlow)">
      SAFETY / MASTER-SKILL
    </text>

    <!-- Subtitle -->
    <text x="0" y="162" class="title-sub" font-size="16">
      Autonomous AI Agent Governance &amp; Cognitive Reasoning Engine
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 192)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="160" height="28" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <circle cx="14" cy="14" r="3" fill="#38bdf8" />
      <text x="26" y="18" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">Task Contracts</text>

      <!-- Pill 2 -->
      <rect x="170" y="0" width="155" height="28" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <circle cx="184" cy="14" r="3" fill="#a855f7" />
      <text x="196" y="18" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">Chaos Adversary</text>

      <!-- Pill 3 -->
      <rect x="335" y="0" width="165" height="28" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <circle cx="349" cy="14" r="3" fill="#34d399" />
      <text x="361" y="18" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">Evidence Ledger</text>

      <!-- Pill 4 -->
      <rect x="510" y="0" width="170" height="28" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <circle cx="524" cy="14" r="3" fill="#f59e0b" />
      <text x="536" y="18" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">Zero Secret Leaks</text>
    </g>
  </g>
</svg>
